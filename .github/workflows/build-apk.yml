name: CI e APK Android

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  quality:
    name: Lint, testes e build web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Auditoria das dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Build web
        run: npm run build

  pair-server:
    name: Servidor de pareamento (Cloudflare Worker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Validar bundle e configuração do Worker
        run: npx wrangler deploy --dry-run --config server/pair/wrangler.jsonc

  apk:
    name: APK Android
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Build web
        run: npm run build
        env:
          # Lista de demonstração para os revisores (docs/demo). Variável do repositório; vazia = sem o botão.
          VITE_DEMO_PLAYLIST_URL: ${{ vars.PULSE_DEMO_PLAYLIST_URL }}
          # Serviço de pareamento pelo celular (RFC-016, https sem barra final). Vazia = o app não oferece o pareamento.
          VITE_PAIR_BASE_URL: ${{ vars.PULSE_PAIR_BASE_URL }}
          # Serviço de licença (RFC-018, server/license, sem barra final). Vazia = sem teste de 7 dias nem bloqueio.
          VITE_LICENSE_BASE_URL: ${{ vars.PULSE_LICENSE_BASE_URL }}

      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      - name: APK debug
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Enviar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Release: só roda se o repositório tiver a chave de publicação nos Secrets
      # (PULSE_KEYSTORE_BASE64, PULSE_KEYSTORE_PASSWORD, PULSE_KEY_ALIAS, PULSE_KEY_PASSWORD).
      - name: Preparar chave de publicação
        id: release_key
        env:
          KEYSTORE_B64: ${{ secrets.PULSE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pulse-release.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: APK e AAB release
        if: steps.release_key.outputs.available == 'true'
        working-directory: android
        env:
          PULSE_KEYSTORE_FILE: ${{ runner.temp }}/pulse-release.jks
          PULSE_KEYSTORE_PASSWORD: ${{ secrets.PULSE_KEYSTORE_PASSWORD }}
          PULSE_KEY_ALIAS: ${{ secrets.PULSE_KEY_ALIAS }}
          PULSE_KEY_PASSWORD: ${{ secrets.PULSE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Enviar release
        if: steps.release_key.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # Link fixo para a TV (Downloader): só com o APK assinado pela chave privada. O APK de debug usa uma chave
      # pública (está no repositório), então qualquer pessoa conseguiria assinar uma "atualização" falsa com ela.
      - name: Preparar APK assinado para download direto
        if: steps.release_key.outputs.available == 'true'
        run: cp android/app/build/outputs/apk/release/*.apk pulse-player.apk

      - name: Publicar Release com APK para Smart TV (Downloader)
        if: steps.release_key.outputs.available == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Pulse Player 2.0 (APK de Teste)
          body: |
            ### Pulse Player 2.0 — Redesign com Menu Lateral e Player OSD
            
            **Como instalar na Smart TV com o app Downloader:**
            1. Abra o app **Downloader** na sua Android TV ou Fire TV.
            2. Digite a URL direta do APK:
               `https://github.com/eduardoVL123/reprodutor_de_video-/releases/download/v2.0.0/pulse-player.apk`
            3. Baixe, instale e abra o aplicativo!
          files: pulse-player.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
